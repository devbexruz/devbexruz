services:
  db:
    image: postgres:16-alpine
    container_name: devbexruz_db
    restart: always
    environment:
      POSTGRES_USER: devbexruz
      POSTGRES_PASSWORD: devbexruz_secret_password
      POSTGRES_DB: devbexruz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devbexruz_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://devbexruz:devbexruz_secret_password@db:5432/devbexruz_db
      SECRET_KEY: devbexruz-production-super-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devbexruz_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
